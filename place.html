<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abuja, Nigeria</title>
    <meta name="description"
        content="Abuja is the planned capital city of Nigeria, located in the central region of the country within the Federal Capital Territory (FCT).">
    <meta name="author" content="Patrick Osakwe">
    <link rel="stylesheet" href="styles/place.css">
    <script src="scripts/place.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arial:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>
    <header>
        <h1>Abuja, Nigeria</h1>
    </header>

    <main>
        <div class="hero">
            <picture>
                <source srcset="week03/images/hero-large.webp" media="(min-width: 1000px)">
                <source srcset="week03/images/hero-medium.webp" media="(min-width: 500px)">
                <img src="week03/images/hero-small.webp" alt="Temple building" width="1500" height="750">
            </picture>

            <section class="data">
                <h2>Data</h2>
                <p><span>Area:</span> 7,315 km²</p>
                <p><span>Population:</span> 3,840,000</p>
                <p><span>Country:</span> Nigeria</p>
                <p><span>Capital:</span> Abuja</p>
                <p><span>Language:</span> English</p>
                <p><span>Currency:</span> Nigerian Naira</p>
            </section>

            <section class="weather">
                <h2>Weather <span class="weather-icon">⛅</span></h2>

                <div class="weather-mobile-icon">
                    <img src="week03/images/weather.svg" alt="Partly cloudy weather">
                </div>

                <p><span>Temperature:</span> 25 °C</p>
                <p><span>Conditions:</span> Partly Cloudy</p>
                <p><span>Wind:</span> 10 km/h</p>
                <p><span>Wind Chill:</span> 25 °C</p>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Patrick Osakwe - Abuja, Nigeria</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
