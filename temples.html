<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temple Album</title>

    <meta name="description"
        content="A responsive temple album displaying information and pictures of temples around the world.">
    <meta name="author" content="Patrick Osakwe">

    <link rel="stylesheet" href="styles/temples.css">

    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

    <header>
        <span id="course-title">Temple Album</span>

        <button id="menu-button" aria-label="Open navigation menu">
            ☰
        </button>

        <nav id="main-nav">
            <a href="#" data-filter="all">Home</a>
            <a href="#" data-filter="old">Old</a>
            <a href="#" data-filter="new">New</a>
            <a href="#" data-filter="large">Large</a>
            <a href="#" data-filter="small">Small</a>
        </nav>
    </header>

    <main>

        <h1>Temple Album</h1>

        <section class="temple-grid" id="temple-container">

            <figure data-year="1893" data-area="253000">
                <img src="images/temple.jpeg" alt="Salt Lake Temple" loading="lazy">
                <figcaption>
                    Salt Lake Temple
                </figcaption>
            </figure>

            <figure data-year="1958" data-area="42000">
                <img src="images/temple.jpeg" alt="London England Temple" loading="lazy">
                <figcaption>
                    London England Temple
                </figcaption>
            </figure>

            <figure data-year="1985" data-area="19000">
                <img src="images/temple.jpeg" alt="Johannesburg South Africa Temple" loading="lazy">
                <figcaption>
                    Johannesburg South Africa Temple
                </figcaption>
            </figure>

            <figure data-year="2004" data-area="17500">
                <img src="images/temple.jpeg" alt="Accra Ghana Temple" loading="lazy">
                <figcaption>
                    Accra Ghana Temple
                </figcaption>
            </figure>

            <figure data-year="2005" data-area="11500">
                <img src="images/temple.jpeg" alt="Aba Nigeria Temple" loading="lazy">
                <figcaption>
                    Aba Nigeria Temple
                </figcaption>
            </figure>

            <figure data-year="2017" data-area="44000">
                <img src="images/temple.jpeg" alt="Paris France Temple" loading="lazy">
                <figcaption>
                    Paris France Temple
                </figcaption>
            </figure>

            <figure data-year="2019" data-area="41000">
                <img src="images/temple.jpeg" alt="Rome Italy Temple" loading="lazy">
                <figcaption>
                    Rome Italy Temple
                </figcaption>
            </figure>

            <figure data-year="2025" data-area="20000">
                <img src="images/temple.jpeg" alt="Lagos Nigeria Temple" loading="lazy">
                <figcaption>
                    Lagos Nigeria Temple
                </figcaption>
            </figure>

            <figure data-year="1974" data-area="160000">
                <img src="images/temple.jpeg" alt="Washington D.C. Temple" loading="lazy">
                <figcaption>
                    Washington D.C. Temple
                </figcaption>
            </figure>


        </section>

    </main>

    <footer>

        <p>
            &copy;<span id="currentyear"></span>
            Patrick Osakwe
            <span>🌍</span>
            Abuja, Nigeria
        </p>

        <p id="lastModified"></p>

    </footer>

</body>

</html>
